[package]
name = "uefivars"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read, write, and manipulate UEFI variable stores in AWS, EDK2/OVMF, and JSON formats"
authors = ["Nathan Reller <nathan@gingercybersecurity.com>"]
repository = "https://github.com/GingerCybersecurity/uefivars-rs"
readme = "README.md"
keywords = ["uefi", "secure-boot", "efi", "firmware", "aws"]
categories = ["command-line-utilities", "parser-implementations"]

[dependencies]
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32c = "0.6"
base64 = "0.22"
sha2 = "0.10"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]

[[bin]]
name = "uefivars"
path = "src/bin/uefivars.rs"
required-features = ["cli"]
